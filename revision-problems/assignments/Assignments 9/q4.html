<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />

    <title>Q4 - Testimonial Section</title>
    <link rel="stylesheet" href="q4.css" />
  </head>
  <body>
    <section class="testimonials">
      <p class="eyebrow">Client feedback</p>
      <h1>What people say</h1>

      <div class="cards">
        <article class="card">
          <p>“The design quality was outstanding. Our team launched faster and with more confidence than ever.”</p>
          <div class="profile">
            <img src="https://images.unsplash.com/photo-1494790108377-be9c29b29330?auto=format&fit=crop&w=500&q=80" alt="Aisha" />
            <div>
              <strong>Aisha K.</strong><br />
              <span>Marketing Lead</span>
            </div>
          </div>
        </article>

        <article class="card featured">
          <p>“They transformed our product into something sleek, modern, and customer-friendly. Highly recommended.”</p>
          <div class="profile">
            <img src="https://images.unsplash.com/photo-1500648767791-00dcc994a43e?auto=format&fit=crop&w=500&q=80" alt="Rohan" />
            <div>
              <strong>Rohan S.</strong><br />
              <span>Product Manager</span>
            </div>
          </div>
        </article>
      </div>
    </section>
  </body>
</html>
