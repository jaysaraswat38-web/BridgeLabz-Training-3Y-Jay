<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Q3 - Product Showcase Card</title>
    <link rel="stylesheet" href="q3.css" />
  </head>
  <body>
    <div class="product-card">
      <div class="badge">NEW</div>
      <img src="https://images.unsplash.com/photo-1542291026-7eec264c27ff?auto=format&fit=crop&w=900&q=80" alt="Red running shoes" />
      <div class="content">
        <p class="category">Running shoes</p>
        <h1>SpeedX Pro</h1>
        <div class="rating">★★★★☆ <span>4.7</span></div>
        <p class="desc">Built for speed, comfort, and everyday performance with responsive cushioning.</p>
        <div class="buy-row">
          <div class="price">$129</div>
          <button>Add to cart</button>
        </div>
      </div>
    </div>
  </body>
</html>
