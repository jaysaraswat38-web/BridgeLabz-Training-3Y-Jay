<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Q1 - Responsive Image Filter Gallery</title>
    <link rel="stylesheet" href="q1.css" />
  </head>
  <body>
    <main class="container">
      <h1>Responsive Image Filter Gallery</h1>
      <section class="gallery" aria-label="Image filter gallery">
        <figure class="gallery-item">
          <img class="filter-blur" src="https://images.unsplash.com/photo-1500530855697-b586d89ba3ee?auto=format&fit=crop&w=900&q=80" alt="Forest path" />
          <figcaption>Blur</figcaption>
        </figure>
        <figure class="gallery-item">
          <img class="filter-grayscale" src="https://images.unsplash.com/photo-1493246507139-91e8fad9978e?auto=format&fit=crop&w=900&q=80" alt="Mountain lake" />
          <figcaption>Grayscale</figcaption>
        </figure>
        <figure class="gallery-item">
          <img class="filter-sepia" src="https://images.unsplash.com/photo-1506744038136-46273834b3fb?auto=format&fit=crop&w=900&q=80" alt="Waterfall" />
          <figcaption>Sepia</figcaption>
        </figure>
        <figure class="gallery-item">
          <img class="filter-brightness" src="https://images.unsplash.com/photo-1470770841072-f978cf4d019e?auto=format&fit=crop&w=900&q=80" alt="Sunset valley" />
          <figcaption>Brightness</figcaption>
        </figure>
        <figure class="gallery-item">
          <img class="filter-contrast" src="https://images.unsplash.com/photo-1501785888041-af3ef285b470?auto=format&fit=crop&w=900&q=80" alt="River valley" />
          <figcaption>Contrast</figcaption>
        </figure>
        <figure class="gallery-item">
          <img class="filter-hue" src="https://images.unsplash.com/photo-1469474968028-56623f02e42e?auto=format&fit=crop&w=900&q=80" alt="Forest with clouds" />
          <figcaption>Hue-rotate</figcaption>
        </figure>
      </section>
    </main>
  </body>
</html>
