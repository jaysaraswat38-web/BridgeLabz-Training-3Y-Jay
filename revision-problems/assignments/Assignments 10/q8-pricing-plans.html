<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Choose Your Plan</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" />
  <link rel="stylesheet" href="q8-pricing-plans.css" />
</head>
<body>
  <div class="container py-5">
    <header class="text-center mb-5">
      <p class="text-uppercase text-primary fw-semibold mb-2">Simple pricing</p>
      <h1 class="display-5 fw-bold">Choose Your Plan</h1>
    </header>
    <div class="row g-4">
      <div class="col-md-4"><div class="card h-100 pricing-card border-0 shadow-sm"><div class="card-body p-4"><h3 class="fw-bold">Starter</h3><div class="price my-3">$19<span class="small">/mo</span></div><ul class="list-unstyled"><li>✔ 1 project</li><li>✔ Basic analytics</li><li>✔ Email support</li></ul><button class="btn btn-outline-primary w-100">Choose Starter</button></div></div></div>
      <div class="col-md-4"><div class="card h-100 pricing-card highlight shadow-lg border-0"><div class="card-body p-4 text-white"><h3 class="fw-bold">Pro</h3><div class="price my-3 text-white">$49<span class="small">/mo</span></div><ul class="list-unstyled"><li>✔ Unlimited projects</li><li>✔ Advanced reporting</li><li>✔ Priority support</li></ul><button class="btn btn-light w-100 text-primary">Choose Pro</button></div></div></div>
      <div class="col-md-4"><div class="card h-100 pricing-card border-0 shadow-sm"><div class="card-body p-4"><h3 class="fw-bold">Enterprise</h3><div class="price my-3">$99<span class="small">/mo</span></div><ul class="list-unstyled"><li>✔ Custom workflows</li><li>✔ Dedicated manager</li><li>✔ SLA guarantee</li></ul><button class="btn btn-outline-primary w-100">Choose Enterprise</button></div></div></div>
    </div>
  </div>
</body>
</html>
