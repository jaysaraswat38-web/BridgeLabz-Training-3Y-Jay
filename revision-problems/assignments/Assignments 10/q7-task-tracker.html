<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Task Tracker</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" />
  <link rel="stylesheet" href="q7-task-tracker.css" />
</head>
<body>
  <div class="container py-5">
    <div class="card shadow-sm border-0">
      <div class="card-body p-4">
        <header class="d-flex justify-content-between align-items-center mb-4">
          <div>
            <p class="text-uppercase text-muted small mb-1">Workspace</p>
            <h1 class="h3 fw-bold mb-0">Task Tracker</h1>
          </div>
          <div class="badge bg-primary rounded-pill px-3 py-2 fs-6">6 Pending</div>
        </header>
        <div class="list-group">
          <div class="list-group-item d-flex justify-content-between align-items-center"><div><div class="fw-semibold">Design homepage mockup</div><small class="text-secondary">Due today</small></div><span class="badge bg-danger">High</span></div>
          <div class="list-group-item d-flex justify-content-between align-items-center"><div><div class="fw-semibold">Prepare sprint summary</div><small class="text-secondary">Due tomorrow</small></div><span class="badge bg-warning text-dark">Medium</span></div>
          <div class="list-group-item d-flex justify-content-between align-items-center"><div><div class="fw-semibold">Respond to client emails</div><small class="text-secondary">Due Friday</small></div><span class="badge bg-success">Low</span></div>
        </div>
        <div class="d-flex justify-content-end mt-4"><button class="btn btn-success">Completed <span class="badge bg-white text-success ms-2">3</span></button></div>
      </div>
    </div>
  </div>
</body>
</html>
