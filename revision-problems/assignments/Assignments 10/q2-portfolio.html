<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Alex Carter | Portfolio</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" />
  <link rel="stylesheet" href="q2-portfolio.css" />
</head>
<body class="bg-light">
  <div class="container py-5">
    <header class="text-center mb-5">
      <h1 class="display-5 fw-bold mb-2">Alex Carter</h1>
      <p class="text-secondary fs-5">UI/UX Designer & Front-End Developer</p>
    </header>
    <main>
      <section class="card shadow-sm border-0 p-5 mb-4 bg-white">
        <div class="row align-items-center g-4">
          <div class="col-md-4 text-center"><img src="https://images.unsplash.com/photo-1500648767791-00dcc994a43e?auto=format&fit=crop&w=500&q=80" alt="Profile" class="img-fluid rounded-circle profile-img" /></div>
          <div class="col-md-8">
            <p class="text-primary fw-semibold mb-2">Hello, I’m Alex</p>
            <h2 class="fw-bold mb-3">I design digital experiences that feel effortless.</h2>
            <p class="text-secondary mb-4">I create modern interfaces, responsive websites, and product experiences that help brands stand out and connect with people.</p>
            <div class="d-flex flex-wrap gap-3">
              <button class="btn btn-primary btn-lg">Hire Me</button>
              <button class="btn btn-outline-dark btn-lg">Download CV</button>
            </div>
          </div>
        </div>
      </section>
      <section class="card shadow-sm border-0 p-4 bg-white">
        <h3 class="text-center fw-bold mb-4">Contact Me</h3>
        <form class="row g-3">
          <div class="col-md-6"><input type="text" class="form-control" placeholder="Your Name" /></div>
          <div class="col-md-6"><input type="email" class="form-control" placeholder="Your Email" /></div>
          <div class="col-12"><textarea class="form-control" rows="4" placeholder="Your Message"></textarea></div>
          <div class="col-12 text-center"><button type="submit" class="btn btn-primary px-4">Send Message</button></div>
        </form>
      </section>
    </main>
  </div>
</body>
</html>
