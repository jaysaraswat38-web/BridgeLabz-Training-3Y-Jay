<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>ShopNova | Product Catalog</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" />
  <link rel="stylesheet" href="q3-product-catalog.css" />
</head>
<body>
  <div class="container py-5">
    <header class="text-center mb-5">
      <p class="text-uppercase text-primary fw-semibold mb-2">New arrivals</p>
      <h1 class="fw-bold">Featured Products</h1>
    </header>
    <main>
      <div class="row g-4">
        <div class="col-12 col-sm-6 col-md-3"><div class="card product-card h-100 border-0 shadow-sm"><img src="https://images.unsplash.com/photo-1542291026-7eec264c27ff?auto=format&fit=crop&w=800&q=80" class="card-img-top product-image" alt="Red sneakers" /><div class="card-body text-center"><h5 class="card-title">Street Runner</h5><p class="price mb-3">$89</p><button class="btn btn-dark w-100">Add to Cart</button></div></div></div>
        <div class="col-12 col-sm-6 col-md-3"><div class="card product-card h-100 border-0 shadow-sm"><img src="https://images.unsplash.com/photo-1523275335684-37898b6baf30?auto=format&fit=crop&w=800&q=80" class="card-img-top product-image" alt="Watch" /><div class="card-body text-center"><h5 class="card-title">Apex Watch</h5><p class="price mb-3">$120</p><button class="btn btn-dark w-100">Add to Cart</button></div></div></div>
        <div class="col-12 col-sm-6 col-md-3"><div class="card product-card h-100 border-0 shadow-sm"><img src="https://images.unsplash.com/photo-1511497584788-876760111969?auto=format&fit=crop&w=800&q=80" class="card-img-top product-image" alt="Backpack" /><div class="card-body text-center"><h5 class="card-title">Trail Pack</h5><p class="price mb-3">$74</p><button class="btn btn-dark w-100">Add to Cart</button></div></div></div>
        <div class="col-12 col-sm-6 col-md-3"><div class="card product-card h-100 border-0 shadow-sm"><img src="https://images.unsplash.com/photo-1521572267360-ee0c2909d518?auto=format&fit=crop&w=800&q=80" class="card-img-top product-image" alt="Headphones" /><div class="card-body text-center"><h5 class="card-title">Echo Headset</h5><p class="price mb-3">$99</p><button class="btn btn-dark w-100">Add to Cart</button></div></div></div>
      </div>
    </main>
  </div>
</body>
</html>
